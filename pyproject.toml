[project]
name = "ledgerguard"
version = "1.0.0"
description = "Financial ledger with verifiable accounting and recoverable transfers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Prateek Raushan"},
]
dependencies = [
    "fastapi>=0.134.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "psycopg[binary,pool]>=3.2.0,<3.3.0",
    "pydantic>=2.9.2,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.2,<0.28.0",
    "anyio>=4.5.0,<4.15.0",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers -p no:anyio"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running PostgreSQL instances",
    "concurrency: tests concurrent execution and race conditions",
    "failure: tests failure and recovery scenarios",
    "property: hypothesis property tests",
]
filterwarnings = [
    "error",
]

[dependency-groups]
dev = []
