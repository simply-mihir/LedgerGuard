services:
  postgres-coordinator:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coordinator_db
      POSTGRES_USER: ledgerguard_admin
      POSTGRES_PASSWORD: ledgerguard_admin_secret
    ports:
      - "127.0.0.1:${COORDINATOR_DB_PORT:-${LEDGERGUARD_PORT_COORD:-5442}}:5432"
    volumes:
      - coordinator_data:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard_admin -d coordinator_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  postgres-ledger1:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger1_db
      POSTGRES_USER: ledgerguard_admin
      POSTGRES_PASSWORD: ledgerguard_admin_secret
    ports:
      - "127.0.0.1:${LEDGER1_DB_PORT:-${LEDGERGUARD_PORT_L1:-5443}}:5432"
    volumes:
      - ledger1_data:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard_admin -d ledger1_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  postgres-ledger2:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger2_db
      POSTGRES_USER: ledgerguard_admin
      POSTGRES_PASSWORD: ledgerguard_admin_secret
    ports:
      - "127.0.0.1:${LEDGER2_DB_PORT:-${LEDGERGUARD_PORT_L2:-5444}}:5432"
    volumes:
      - ledger2_data:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerguard_admin -d ledger2_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

volumes:
  coordinator_data:
  ledger1_data:
  ledger2_data:
